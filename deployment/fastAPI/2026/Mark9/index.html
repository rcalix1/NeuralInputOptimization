<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>NIO Interface</title>

<style>

/* ==========================================================
   PAGE
   ========================================================== */

body
{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f0f0f0;
}

/* ==========================================================
   TOP BAR
   ========================================================== */

#topBar
{
    background:#2d2d2d;
    color:white;
    padding:15px;
}

#topBar h2
{
    margin:0 0 10px 0;
}

#serverRow
{
    display:flex;
    gap:10px;
    align-items:center;
}

#serverRow input
{
    width:120px;
    padding:5px;
}

/* ==========================================================
   MAIN LAYOUT
   ========================================================== */

#mainContainer
{
    display:flex;
    height:calc(100vh - 90px);
}

/* ==========================================================
   LEFT PANEL
   ========================================================== */

#leftPanel
{
    width:450px;
    overflow-y:auto;
    background:white;
    padding:20px;
    border-right:2px solid #cccccc;
}

/* ==========================================================
   RIGHT PANEL
   ========================================================== */

#rightPanel
{
    flex:1;
    padding:20px;
}

#outputBox
{
    width:100%;
    height:100%;
    box-sizing:border-box;

    background:black;
    color:#00ff00;

    font-family:Courier New;
    font-size:14px;

    padding:10px;

    white-space:pre-wrap;

    overflow-y:scroll;
}

/* ==========================================================
   INPUT ROWS
   ========================================================== */

.sectionTitle
{
    margin-top:30px;
    margin-bottom:10px;
    font-weight:bold;
    font-size:18px;
}

.row
{
    display:flex;
    align-items:center;
    margin-bottom:8px;
}

.row label
{
    width:180px;
}

.row input
{
    width:120px;
    padding:5px;
}

/* ==========================================================
   SAVED CASES / REPORT
   ========================================================== */

#savedCasesPanel
{
    background:white;
    padding:20px;
    border-top:2px solid #cccccc;
}

.reportButtons
{
    display:flex;
    gap:10px;
}

.savedCase
{
    margin-bottom:15px;
    border:1px solid #cccccc;
    background:#f5f5f5;
}

.savedCaseHeader
{
    padding:12px;
    font-weight:bold;
    cursor:pointer;
    background:#e5e5e5;
}

.savedCaseHeader:hover
{
    background:#d5d5d5;
}

.savedCaseContent
{
    display:none;
    padding:15px;
}

.savedCaseText
{
    background:black;
    color:#00ff00;

    font-family:"Courier New", monospace;
    font-size:13px;

    white-space:pre-wrap;

    padding:15px;
    margin-bottom:20px;

    max-height:500px;
    overflow:auto;
}


/* ==========================================================
   SAVED PLOT GRID
   ========================================================== */

.savedPlotsGrid
{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.savedPlotBox
{
    background:white;
}

.savedPlotBox h3
{
    margin:0 0 5px 0;
}

.savedPlot
{
    width:100%;
    border:1px solid #999999;
}


/* ==========================================================
   PRINT / PDF
   ========================================================== */

@media print
{
    #topBar,
    #mainContainer,
    #plotPanel,
    .reportButtons
    {
        display:none !important;
    }

    body
    {
        background:white;
    }

    #savedCasesPanel
    {
        border:none;
        padding:0;
    }

    .savedCase
    {
        background:white;
        border:none;
        margin-bottom:30px;
    }

    .savedCaseHeader
    {
        background:white;
        border-bottom:2px solid black;
        font-size:18px;
    }

    .savedCaseContent
    {
        display:block !important;
    }

    .savedCaseText
    {
        background:white;
        color:black;

        max-height:none;
        overflow:visible;

        border:1px solid #cccccc;
    }

    .savedPlotsGrid
    {
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:15px;
    }

    .savedPlotBox
    {
        break-inside:avoid;
    }

    .savedPlot
    {
        width:100%;
    }
}

/* ==========================================================
   BUTTON
   ========================================================== */

#runButton
{
    margin-top:30px;
    width:100%;
    height:60px;
    font-size:22px;
    cursor:pointer;
}

/* ==========================================================
   PLOT PANEL
   ========================================================== */

#plotPanel
{
    background:white;
    padding:20px;
    border-top:2px solid #cccccc;
}

#progressPlot
{
    width:100%;
    max-width:1200px;
    display:block;
    margin:auto;
    border:1px solid #999999;
}

</style>

</head>

<body>

<div class="sectionTitle">

<div class="row">

     SAVED CASES
========================================================= -->

<!-- =========================================================
     SAVED CASES / REPORT
========================================================= -->

<div id="savedCasesPanel">

    <h2>Saved Cases / Report</h2>

    <div class="reportButtons">

        <button onclick="loadSavedCases()">
            Refresh
        </button>

        <button onclick="expandAll()">
            Expand All
        </button>

        <button onclick="collapseAll()">
            Collapse All
        </button>

        <button onclick="printReport()">
            Print / Save PDF
        </button>

    </div>

    <br>

    <div id="savedCasesList">
        No saved cases loaded.
    </div>

<!-- ==========================================================
     JAVASCRIPT
========================================================== -->

<script>

/* ==========================================================
   Run and save buttons
========================================================== */

document.getElementById("runButton").onclick = runNIO;

document.getElementById("saveButton").onclick = saveCase;

/* ==========================================================
   Main function
========================================================== */

async function saveCase()
{
    const ip = document.getElementById("serverIP").value;
    const port = document.getElementById("serverPort").value;

    const url =
        "http://" + ip + ":" + port + "/save";

    try
    {
        const response = await fetch(url,
        {
            method: "POST"
        });

        const result = await response.json();

        if (result.saved)
        {
            alert("Case saved: " + result.timestamp);
        }
        else
        {
            alert("Could not save case.");
        }
    }
    catch (error)
    {
        alert("Save error: " + error);
    }
}


async function loadSavedCases()
{
    const ip = document.getElementById("serverIP").value;
    const port = document.getElementById("serverPort").value;

    const url =
        "http://" + ip + ":" + port + "/saved_cases";

    try
    {
        const response = await fetch(url);
        const cases = await response.json();

        const list =
            document.getElementById("savedCasesList");

        list.innerHTML = "";

        cases.forEach(caseName =>
        {
            // ==============================================
            // MAIN CASE
            // ==============================================

            const caseDiv =
                document.createElement("div");

            caseDiv.className = "savedCase";


            // ==============================================
            // HEADER
            // ==============================================

            const header =
                document.createElement("div");

            header.className = "savedCaseHeader";

            header.innerHTML =
                "▶ " + caseName;


            // ==============================================
            // CONTENT
            // ==============================================

            const content =
                document.createElement("div");

            content.className =
                "savedCaseContent";


            // ==============================================
            // TEXT RESULTS
            // ==============================================

            const text =
                document.createElement("div");

            text.className =
                "savedCaseText";

            text.innerHTML =
                "Loading...";

            content.appendChild(text);


            // ==============================================
            // PLOTS
            // ==============================================

            const grid =
                document.createElement("div");

            grid.className =
                "savedPlotsGrid";


            const plots =
            [
                ["cost", "Cost"],
                ["coke", "Coke Rate"],
                ["hmt", "HMT"],
                ["prod", "Production"],
                ["fta", "FTA"],
                ["tgt", "TGT"]
            ];


            plots.forEach(plot =>
            {
                const box =
                    document.createElement("div");

                box.className =
                    "savedPlotBox";


                const title =
                    document.createElement("h3");

                title.innerHTML =
                    plot[1];


                const image =
                    document.createElement("img");

                image.className =
                    "savedPlot";

                image.src =
                    "http://" +
                    ip +
                    ":" +
                    port +
                    "/saved/" +
                    caseName +
                    "_" +
                    plot[0] +
                    ".png";


                box.appendChild(title);
                box.appendChild(image);

                grid.appendChild(box);
            });


            content.appendChild(grid);


            // ==============================================
            // EXPAND / COLLAPSE
            // ==============================================

            header.onclick =
                async function()
            {
                const open =
                    content.style.display === "block";

                if(open)
                {
                    content.style.display =
                        "none";

                    header.innerHTML =
                        "▶ " + caseName;
                }
                else
                {
                    content.style.display =
                        "block";

                    header.innerHTML =
                        "▼ " + caseName;


                    // Load text only first time

                    if(text.innerHTML === "Loading...")
                    {
                        const textURL =
                            "http://" +
                            ip +
                            ":" +
                            port +
                            "/saved/" +
                            caseName +
                            ".txt";

                        const response =
                            await fetch(textURL);

                        text.textContent =
                            await response.text();
                    }
                }
            };


            caseDiv.appendChild(header);
            caseDiv.appendChild(content);

            list.appendChild(caseDiv);
        });
    }
    catch(error)
    {
        document.getElementById(
            "savedCasesList"
        ).innerHTML =
            "Could not load saved cases.";
    }
}


function expandAll()
{
    const cases =
        document.querySelectorAll(".savedCase");

    cases.forEach(caseDiv =>
    {
        const header =
            caseDiv.querySelector(".savedCaseHeader");

        const content =
            caseDiv.querySelector(".savedCaseContent");

        if(content.style.display !== "block")
        {
            header.click();
        }
    });
}


function collapseAll()
{
    const cases =
        document.querySelectorAll(".savedCase");

    cases.forEach(caseDiv =>
    {
        const header =
            caseDiv.querySelector(".savedCaseHeader");

        const content =
            caseDiv.querySelector(".savedCaseContent");

        if(content.style.display === "block")
        {
            header.click();
        }
    });
}


function printReport()
{
    window.print();
}


   
   
function showPlot(name)
{
    const ip = document.getElementById("serverIP").value;
    const port = document.getElementById("serverPort").value;

    progressPlot2.src =
        "http://" + ip + ":" + port +
        "/plots/" + name + ".png?" + Date.now();
}

async function runNIO()
{

    // Clear previous output

    document.getElementById("outputBox").value = "Running...\n";

    // Server information

    const ip = document.getElementById("serverIP").value;

    const port = document.getElementById("serverPort").value;

    // FastAPI URL

    const url =
        "http://" +
        ip +
        ":" +
        port +
        "/NIOoptimize";

    // Build JSON exactly like the curl command

    const data =
    {
        tgt: Number(document.getElementById("tgt").value),
        hmt: Number(document.getElementById("hmt").value),
        prod_rt: Number(document.getElementById("prod_rt").value),
        fta: Number(document.getElementById("fta").value),
        coke_rt: Number(document.getElementById("coke_rt").value),

        i_h2i_rate: Number(document.getElementById("i_h2i_rate").value),
        i_pci_rate: Number(document.getElementById("i_pci_rate").value),
        i_ngi_rate: Number(document.getElementById("i_ngi_rate").value),
        i_o2_volfract: Number(document.getElementById("i_o2_volfract").value),
        i_h2_temp: Number(document.getElementById("i_h2_temp").value),
        i_hbtemp: Number(document.getElementById("i_hbtemp").value),
        i_wind_rt: Number(document.getElementById("i_wind_rt").value),

        xmin_i_h2i_rate: Number(document.getElementById("xmin_i_h2i_rate").value),
        xmin_i_pci_rate: Number(document.getElementById("xmin_i_pci_rate").value),
        xmin_i_ngi_rate: Number(document.getElementById("xmin_i_ngi_rate").value),
        xmin_i_o2_volfract: Number(document.getElementById("xmin_i_o2_volfract").value),
        xmin_i_h2_temp: Number(document.getElementById("xmin_i_h2_temp").value),
        xmin_i_hbtemp: Number(document.getElementById("xmin_i_hbtemp").value),
        xmin_i_wind_rt: Number(document.getElementById("xmin_i_wind_rt").value),

        xmax_i_h2i_rate: Number(document.getElementById("xmax_i_h2i_rate").value),
        xmax_i_pci_rate: Number(document.getElementById("xmax_i_pci_rate").value),
        xmax_i_ngi_rate: Number(document.getElementById("xmax_i_ngi_rate").value),
        xmax_i_o2_volfract: Number(document.getElementById("xmax_i_o2_volfract").value),
        xmax_i_h2_temp: Number(document.getElementById("xmax_i_h2_temp").value),
        xmax_i_hbtemp: Number(document.getElementById("xmax_i_hbtemp").value),
        xmax_i_wind_rt: Number(document.getElementById("xmax_i_wind_rt").value),

        ymin_tgt: Number(document.getElementById("ymin_tgt").value),
        ymin_hmt: Number(document.getElementById("ymin_hmt").value),
        ymin_prod_rt: Number(document.getElementById("ymin_prod_rt").value),
        ymin_fta: Number(document.getElementById("ymin_fta").value),
        ymin_coke_rt: Number(document.getElementById("ymin_coke_rt").value),

        ymax_tgt: Number(document.getElementById("ymax_tgt").value),
        ymax_hmt: Number(document.getElementById("ymax_hmt").value),
        ymax_prod_rt: Number(document.getElementById("ymax_prod_rt").value),
        ymax_fta: Number(document.getElementById("ymax_fta").value),
        ymax_coke_rt: Number(document.getElementById("ymax_coke_rt").value),

        hmt_center_delta: Number(document.getElementById("hmt_center_delta").value),
        quad_exp_weight: Number(document.getElementById("quad_exp_weight").value),
        iters: Number(document.getElementById("iters").value)

    };

    try
    {

        const response = await fetch(url,
        {
            method: "POST",

            headers:
            {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)
        });

        const text = await response.text();

          // Display whatever FastAPI returned.
        // If your endpoint returns plain text, it will appear exactly here.
        // If it returns JSON, it will also be displayed as text.

        document.getElementById("outputBox").value = text;

       document.getElementById("progressPlot").src =
                   "http://" + ip + ":" + port + "/plots/test_plot.png?t=" + new Date().getTime();

    }
    catch (error)
    {
        document.getElementById("outputBox").value =
            "Connection Error\n\n" +
            error;
    }

}

</script>

</body>
